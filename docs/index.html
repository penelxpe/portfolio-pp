    <script>
        const introVideo = document.querySelector(".videointro");

        function playIntro() {
            introVideo.muted = true;
            introVideo.defaultMuted = true;
            introVideo.removeAttribute("controls");
            introVideo.play().then(() => {
                introVideo.classList.remove("autoplay-blocked");
            }).catch((error) => {
                introVideo.classList.add("autoplay-blocked");
                if (!introVideo.dataset.autoplayWarningShown) {
                    console.warn("Intro video autoplay was blocked by the browser.", error);
                    introVideo.dataset.autoplayWarningShown = "true";
                }
            });
        }

        introVideo.addEventListener("canplay", playIntro, {
            once: true
        });
        document.addEventListener("visibilitychange", () => {
            if (!document.hidden && introVideo.paused) {
                playIntro();
            }
        });
        playIntro();
    </script>
